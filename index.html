<script>
/* ✅ Dominio institucional + auto-login + redirección */
(function () {
  const cfgDom = (window.NEUROVERBS_CONFIG ? window.NEUROVERBS_CONFIG.allowedDomain : undefined);
  const storedDom = localStorage.getItem('ALLOWED_DOMAIN_NV');
  const ALLOWED_DOMAIN = (cfgDom !== undefined ? cfgDom : (storedDom !== null ? storedDom : 'iemanueljbetancur.edu.co'));
const TARGET = 'neuroverbs.html';

  function decodeJwtPayload(jwt) {
    try {
      const part = jwt.split(".")[1];
      const b64 = part.replace(/-/g, "+").replace(/_/g, "/");
      const json = decodeURIComponent(atob(b64).split("").map(c => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2)).join(""));
      return JSON.parse(json);
    } catch (_) {
      return null;
    }
  }

  // ✅ Si ya está autenticado en ESTA página, redirige sin pedir clic
  // (esto aplica cuando core.js ya guardó sesión del usuario aquí)
  function tryRedirectIfAlreadyAuthed() {
    try {
      const raw = localStorage.getItem("rank_user") || localStorage.getItem("mjb_user") || "";
      if (!raw) return false;
      const u = JSON.parse(raw);
      const email = (u.email || "").toLowerCase();
      if (email && (!ALLOWED_DOMAIN || email.endsWith("@" + ALLOWED_DOMAIN))) {
        window.location.replace(TARGET);
        return true;
      }
    } catch (_) {}
    return false;
  }

  // Intenta redirigir inmediatamente si detecta sesión local
  if (tryRedirectIfAlreadyAuthed()) return;

  function patch() {
    if (!window.google || !google.accounts || !google.accounts.id || !google.accounts.id.initialize) return false;

    const origInit = google.accounts.id.initialize;
    if (origInit.__mjb_patched__) return true;

    google.accounts.id.initialize = function (cfg) {
      cfg = cfg || {};

      // 1) Hint de dominio (Workspace)
      if (!cfg.hd) cfg.hd = ALLOWED_DOMAIN;

      // 2) Auto select si ya hay una sesión válida en Google
      if (!("auto_select" in cfg)) cfg.auto_select = true;
      if (!("itp_support" in cfg)) cfg.itp_support = true;

      // 3) Envolver callback: guardar usuario + redirigir a /neuroverbs/
      const userCb = cfg.callback;
      cfg.callback = function (resp) {
        let ok = false;
        let payload = null;

        try {
          const token = resp && resp.credential;
          if (token) {
            payload = decodeJwtPayload(token);
            const email = (payload && payload.email ? String(payload.email) : "").toLowerCase();
            ok = (!ALLOWED_DOMAIN || email.endsWith("@" + ALLOWED_DOMAIN));

            // guarda “sesión” local para redirección automática futura
            if (ok) {
              localStorage.setItem("rank_user", JSON.stringify({
                name: payload.name || "",
                email,
                picture: payload.picture || "",
                ts: Date.now()
              }));
            }
          }
        } catch (e) {
          console.error(e);
        }

        // Callback original
        try { if (typeof userCb === "function") userCb(resp); } catch (e) { console.error(e); }

        // Redirección final
        if (ok) {
          // Si quieres pasar el token al destino:
          // const next = TARGET + "#id_token=" + encodeURIComponent(resp.credential) + "&src=mjb";
          // window.location.replace(next);
          window.location.replace(TARGET);
        }
      };

      return origInit.call(this, cfg);
    };

    google.accounts.id.initialize.__mjb_patched__ = true;

    // ✅ Dispara One Tap / auto sign-in cuando sea posible
    try {
      google.accounts.id.prompt();
    } catch (_) {}

    return true;
  }

  const t = setInterval(() => { if (patch()) clearInterval(t); }, 50);
})();
</script>

<script>
(function(){
  try{
    const cfg = (window.NEUROVERBS_CONFIG ? window.NEUROVERBS_CONFIG.allowedDomain : undefined);
    const stored = localStorage.getItem("ALLOWED_DOMAIN_NV");
    const d = (cfg !== undefined ? cfg : (stored !== null ? stored : "iemanueljbetancur.edu.co"));
    const el = document.querySelector(".authDomainLabel");
    if (el) el.textContent = (d ? ("Acceder con @" + d) : "Acceder con cualquier cuenta de Google");
  }catch(_){}
})();
</script>

<script>
(function(){
  try{ if('scrollRestoration' in history) history.scrollRestoration = 'manual'; }catch(e){}

  function forceTop(){
    try{ window.scrollTo({ top: 0, left: 0, behavior: 'auto' }); }
    catch(e){ try{ window.scrollTo(0,0); }catch(_){} }
  }

  function forceTopSettled(){
    forceTop();
    requestAnimationFrame(forceTop);
    requestAnimationFrame(()=>requestAnimationFrame(forceTop));
    setTimeout(forceTop, 50);
    setTimeout(forceTop, 200);
  }

  // ✅ Al refrescar, quedar como en la pantalla principal (banner + ranking visibles)
  window.addEventListener('DOMContentLoaded', forceTopSettled, { once:true });
  window.addEventListener('load', forceTopSettled, { once:true });
  window.addEventListener('pageshow', forceTopSettled);
})();
</script>
